<!-- Firebase SDK 로드 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 1. 발급받은 실제 Firebase Config 입력
  const firebaseConfig = {
    apiKey: "AIzaSyCc7wRYcSrNK193IUxU1auHuDlOcSIZ2xg",
    authDomain: "test20261022-edd9f.firebaseapp.com",
    projectId: "test20261022-edd9f",
    storageBucket: "test20261022-edd9f.firebasestorage.app",
    messagingSenderId: "161557345575",
    appId: "1:161557345575:web:9a69eabc0ca58266eb2502"
  };

  // 2. 초기화
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 3. 학생 익명 로그인 실행
  signInAnonymously(auth).catch((err) => console.error("Auth Error:", err));

  // 4. 데이터베이스 컬렉션 연결 (일반 웹사이트용 'leaderboard' 컬렉션)
  const leaderboardCol = collection(db, "leaderboard");

  // 실시간 랭킹 구독 함수
  window.subscribeLeaderboard = function(callback) {
    const q = query(leaderboardCol, limit(50));
    return onSnapshot(q, (snapshot) => {
      const list = [];
      snapshot.forEach(doc => list.push(doc.data()));
      // 클라이언트 측 정렬 (점수 내림차순 -> 정확도 내림차순)
      list.sort((a, b) => b.score - a.score || b.accuracy - a.accuracy);
      callback(list.slice(0, 20));
    });
  };

  // 점수 등록 함수
  window.saveScoreToFirebase = async function(name, score, accuracy) {
    await addDoc(leaderboardCol, {
      name: name,
      score: score,
      accuracy: accuracy,
      createdAt: new Date().toISOString()
    });
  };
</script>
