<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>중3 수학: 유리수 vs 무리수 스피드 분류전</title>
  
  <!-- KaTeX 공식 렌더링 CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --rational-color: #2563eb;
      --irrational-color: #dc2626;
      --success: #16a34a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      height: 94vh;
      max-height: 820px;
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    /* 상단 상태 바 */
    .header-bar {
      padding: 16px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timer-badge {
      background: #f1f5f9;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 1.15rem;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-urgent {
      background: #fee2e2;
      color: #dc2626;
      animation: pulse 1s infinite;
    }

    .score-badge {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
    }

    /* 콤보 인디케이터 */
    .combo-container {
      height: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .combo-text {
      font-weight: 900;
      font-size: 1rem;
      color: #ea580c;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .combo-text.active {
      opacity: 1;
      transform: scale(1.1);
    }

    /* 카드 무대 */
    .play-arena {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 20px;
    }

    .card {
      width: 100%;
      height: 240px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px solid #e2e8f0;
      position: absolute;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease;
      cursor: grab;
      padding: 16px;
    }

    .card .math-exp {
      font-size: 2.7rem;
      color: var(--text);
      pointer-events: none;
    }

    .card .swipe-guide {
      position: absolute;
      bottom: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      opacity: 0.7;
    }

    /* 스와이프 및 정답 피드백 효과 */
    .card.swipe-left {
      transform: translateX(-160%) rotate(-25deg) !important;
      opacity: 0;
    }

    .card.swipe-right {
      transform: translateX(160%) rotate(25deg) !important;
      opacity: 0;
    }

    .shake-animation {
      animation: shake 0.35s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    /* 하단 조작 버튼 영역 */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 12px 20px 24px;
    }

    .choice-btn {
      padding: 18px 0;
      border-radius: 18px;
      border: none;
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      transition: transform 0.1s ease, filter 0.1s ease;
    }

    .choice-btn:active {
      transform: scale(0.96);
    }

    .btn-sub {
      font-size: 0.8rem;
      font-weight: 500;
      opacity: 0.85;
    }

    .btn-rational {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    }

    .btn-irrational {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
    }

    /* 오버레이 화면 (시작, 결과, 랭킹) */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      transition: opacity 0.3s ease;
    }

    .hidden {
      display: none !important;
    }

    .title-h1 {
      font-size: 1.8rem;
      font-weight: 900;
      margin-bottom: 6px;
      color: #1e293b;
    }

    .desc-p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .start-btn, .action-btn {
      width: 100%;
      max-width: 280px;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.4);
      margin-top: 8px;
    }

    .secondary-btn {
      background: #f1f5f9;
      color: #334155;
      box-shadow: none;
      margin-top: 10px;
    }

    /* 결과 요약 카드 */
    .result-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      margin: 16px 0;
    }

    .stat-box {
      background: #f8fafc;
      padding: 12px 6px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--text);
    }

    /* 랭킹 등록 영역 */
    .rank-input-group {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 320px;
      margin-top: 8px;
    }

    .rank-input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
    }

    .rank-submit-btn {
      padding: 12px 18px;
      background: var(--success);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 랭킹 목록 뷰 */
    .ranking-list-container {
      width: 100%;
      flex: 1;
      overflow-y: auto;
      margin: 12px 0;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      background: #ffffff;
      max-height: 380px;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
    }

    .ranking-item:nth-child(1) { background: #fef9c3; font-weight: 800; }
    .ranking-item:nth-child(2) { background: #f1f5f9; font-weight: 700; }
    .ranking-item:nth-child(3) { background: #ffedd5; font-weight: 700; }

    /* 오답 노트 토글 */
    .review-container {
      width: 100%;
      max-height: 130px;
      overflow-y: auto;
      text-align: left;
      margin-top: 8px;
      padding: 8px;
      background: #f8fafc;
      border-radius: 12px;
      font-size: 0.85rem;
    }

    .review-item {
      padding: 6px 8px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="container" id="app">
  <!-- 상단 게임 상태 -->
  <div class="header-bar">
    <div class="timer-badge" id="timerBadge">⏱ 60s</div>

<!-- ==========================================
     1. 중학교 3학년 수학 문제 카드 데이터셋
     ========================================== -->
<script>
const CARD_DATASET = [
  // 유리수 (분수, 유한소수, 순환소수, 완전제곱수 근호)
  { latex: "0", type: "rational", desc: "0은 정수이므로 유리수입니다." },
  { latex: "-3", type: "rational", desc: "음의 정수이므로 유리수입니다." },
  { latex: "\\frac{3}{5}", type: "rational", desc: "정수 분수 형태이므로 유리수입니다." },
  { latex: "0.25", type: "rational", desc: "유한소수는 유리수입니다." },
  { latex: "0.\\dot{3}", type: "rational", desc: "순환소수는 분수(1/3)로 나타낼 수 있어 유리수입니다." },
  { latex: "\\sqrt{4}", type: "rational", desc: "√4 = 2 이므로 유리수입니다." },
  { latex: "\\sqrt{0.25}", type: "rational", desc: "√0.25 = 0.5 이므로 유리수입니다." },
  { latex: "-\\sqrt{49}", type: "rational", desc: "-√49 = -7 이므로 유리수입니다." },
  { latex: "0.\\dot{4}\\dot{5}", type: "rational", desc: "순환소수는 45/99 = 5/11 로 바꿀 수 있어 유리수입니다." },
  { latex: "\\sqrt{\\frac{4}{9}}", type: "rational", desc: "√(4/9) = 2/3 이므로 유리수입니다." },
  { latex: "3.14", type: "rational", desc: "유한소수 3.14는 314/100 이므로 유리수입니다." },
  { latex: "\\sqrt{100}", type: "rational", desc: "√100 = 10 이므로 유리수입니다." },

  // 무리수 (근호 탈출 불가, 원주율, 비순환 무한소수)
  { latex: "\\sqrt{2}", type: "irrational", desc: "근호를 벗겨낼 수 없는 무리수입니다." },
  { latex: "\\sqrt{3}", type: "irrational", desc: "근호를 벗겨낼 수 없는 무리수입니다." },
  { latex: "\\pi", type: "irrational", desc: "원주율 π는 비순환 무한소수인 무리수입니다." },
  { latex: "2\\pi", type: "irrational", desc: "무리수에 0이 아닌 유리수를 곱해도 무리수입니다." },
  { latex: "1 + \\sqrt{2}", type: "irrational", desc: "유리수 + 무리수는 항상 무리수입니다." },
  { latex: "\\sqrt{5} - 3", type: "irrational", desc: "무리수 - 유리수는 항상 무리수입니다." },
  { latex: "\\sqrt{12}", type: "irrational", desc: "√12 = 2√3 으로 근호를 완전히 벗겨낼 수 없습니다." },
  { latex: "\\sqrt{0.4}", type: "irrational", desc: "√0.4는 제곱수가 아니므로 근호를 벗길 수 없습니다." },
  { latex: "0.101001000\\dots", type: "irrational", desc: "순환하지 않는 무한소수는 무리수입니다." },
  { latex: "-\\sqrt{7}", type: "irrational", desc: "근호를 벗겨낼 수 없는 무리수입니다." },
  { latex: "\\frac{\\sqrt{3}}{2}", type: "irrational", desc: "무리수를 정수로 나누어도 무리수입니다." },
  { latex: "\\sqrt{20}", type: "irrational", desc: "√20 = 2√5 이므로 무리수입니다." }
];
</script>

<!-- ==========================================
     2. Firebase Firestore 연동 모듈
     ========================================== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // ⚠️ 본인의 Firebase 웹 앱 설정 값으로 교체하세요.
  const firebaseConfig = {
    apiKey: "AIzaSyCc7wRYcSrNK193IUxU1auHuDlOcSIZ2xg",
    authDomain: "test20261022-edd9f.firebaseapp.com",
    projectId: "test20261022-edd9f",
    storageBucket: "test20261022-edd9f.firebasestorage.app",
    messagingSenderId: "161557345575",
    appId: "1:161557345575:web:9a69eabc0ca58266eb2502"
  };

  let db = null;
  let isFirebaseReady = false;

  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    db = getFirestore(app);

    signInAnonymously(auth)
      .then(() => {
        isFirebaseReady = true;
      })
      .catch((err) => {
        console.warn("Firebase 익명 로그인 실패 (보안 규칙 또는 Authentication 활성화 확인 필요):", err);
      });
  } catch (e) {
    console.warn("Firebase 초기화 대기: 설정 키를 확인하세요.", e);
  }

  // 실시간 랭킹 리스너 전역 함수
  window.subscribeRanking = function(updateCallback) {
    if (!db) {
      updateCallback([{ name: "안내", score: "-", accuracy: "Firebase 키 설정 필요" }]);
      return () => {};
    }

    const leaderboardRef = collection(db, "leaderboard");
    const q = query(leaderboardRef, limit(60));

    return onSnapshot(q, (snapshot) => {
      const records = [];
      snapshot.forEach(doc => records.push(doc.data()));
      // 클라이언트 정렬: 점수 내림차순 -> 정확도 내림차순
      records.sort((a, b) => (b.score - a.score) || (b.accuracy - a.accuracy));
      updateCallback(records.slice(0, 20));
    }, (error) => {
      console.error("랭킹 로드 실패:", error);
      updateCallback([{ name: "오류", score: "-", accuracy: "권한 확인 필요" }]);
    });
  };

  // 랭킹 저장 전역 함수
  window.uploadScore = async function(name, score, accuracy) {
    if (!db || !isFirebaseReady) {
      throw new Error("Firebase 설정이 완료되지 않았습니다.");
    }
    const leaderboardRef = collection(db, "leaderboard");
    await addDoc(leaderboardRef, {
      name: name,
      score: score,
      accuracy: accuracy,
      timestamp: Date.now()
    });
  };
</script>

     3. 게임 플레이 및 UI 제어 스크립트

<script>
  // 게임 상태 변수
  let timer = 60;
  let timerInterval = null;
  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let totalAttempts = 0;
  let correctCount = 0;
  let isPlaying = false;
  let currentCard = null;
  let deck = [];
  let wrongProblems = [];
  let unsubscribeRank = null;

  // DOM 캐싱
  const activeCard = document.getElementById('activeCard');
  const cardMath = document.getElementById('cardMath');
  const timerBadge = document.getElementById('timerBadge');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const comboBadge = document.getElementById('comboBadge');
  const startModal = document.getElementById('startModal');
  const resultModal = document.getElementById('resultModal');
  const rankBoardModal = document.getElementById('rankBoardModal');
  const reviewBox = document.getElementById('reviewBox');
  const reviewList = document.getElementById('reviewList');
  const playerNameInput = document.getElementById('playerName');
  const rankFeedback = document.getElementById('rankFeedback');

  // 덱 셔플
  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 다음 카드 표시
  function nextCard() {
    if (deck.length === 0) {
      deck = shuffle(CARD_DATASET);
    }
    currentCard = deck.pop();
    
    // KaTeX로 수식 렌더링
    if (window.katex) {
      katex.render(currentCard.latex, cardMath, {
        throwOnError: false,
        displayMode: true
      });
    } else {
      cardMath.textContent = currentCard.latex;
    }

    // 카드 애니메이션 리셋
    activeCard.className = 'card';
    activeCard.style.transform = '';
  }

  // 정답 판정
  function makeChoice(chosenType) {
    if (!isPlaying || !currentCard) return;

    totalAttempts++;
    const isCorrect = (chosenType === currentCard.type);

    if (isCorrect) {
      correctCount++;
      combo++;
      if (combo > maxCombo) maxCombo = combo;

      // 점수 계산: 기본 10점 + 콤보 보너스 (정수형)
      const bonus = Math.floor(combo / 3) * 2;
      score += (10 + bonus);

      // 콤보 뱃지 표시
      comboBadge.textContent = `🔥 ${combo} COMBO! (+${bonus})`;
      comboBadge.classList.add('active');

      // 우측 또는 좌측으로 날아가는 모션
      activeCard.classList.add(chosenType === 'rational' ? 'swipe-left' : 'swipe-right');
    } else {
      combo = 0;
      comboBadge.classList.remove('active');
      activeCard.classList.add('shake-animation');
      wrongProblems.push(currentCard);
    }

    scoreDisplay.textContent = `${score}점`;

    setTimeout(() => {
      nextCard();
    }, 220);
  }

  // 게임 시작
  function startGame() {
    score = 0;
    combo = 0;
    maxCombo = 0;
    totalAttempts = 0;
    correctCount = 0;
    timer = 60;
    wrongProblems = [];
    deck = shuffle(CARD_DATASET);

    scoreDisplay.textContent = '0점';
    timerBadge.textContent = '⏱ 60s';
    timerBadge.classList.remove('timer-urgent');
    comboBadge.classList.remove('active');

    startModal.classList.add('hidden');
    resultModal.classList.add('hidden');
    rankBoardModal.classList.add('hidden');
    isPlaying = true;

    nextCard();

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timer--;
      timerBadge.textContent = `⏱ ${timer}s`;

      if (timer <= 10) {
        timerBadge.classList.add('timer-urgent');
      }

      if (timer <= 0) {
        endGame();
      }
    }, 1000);
  }

  // 게임 종료
  function endGame() {
    isPlaying = false;
    clearInterval(timerInterval);

    const accuracy = totalAttempts > 0 ? Math.round((correctCount / totalAttempts) * 100) : 0;
    
    document.getElementById('resScore').textContent = score;
    document.getElementById('resAccuracy').textContent = `${accuracy}%`;
    document.getElementById('resCombo').textContent = maxCombo;

    // 오답 복습 렌더링
    reviewList.innerHTML = '';
    if (wrongProblems.length > 0) {
      reviewBox.classList.remove('hidden');
      wrongProblems.forEach(item => {
        const row = document.createElement('div');
        row.className = 'review-item';
        row.innerHTML = `
          <span>수식: <strong>\\(${item.latex}\\)</strong></span>
          <span style="color:#64748b;">${item.type === 'rational' ? '유리수' : '무리수'} (${item.desc})</span>
        `;
        reviewList.appendChild(row);
      });
      // 오답 목록 내 수식 렌더링
      if (window.renderMathInElement) {
        renderMathInElement(reviewList);
      }
    } else {
      reviewBox.classList.add('hidden');
    }

    // 랭킹 입력 영역 초기화
    document.getElementById('rankInputArea').style.display = 'flex';
    rankFeedback.textContent = '';
    playerNameInput.value = '';

    resultModal.classList.remove('hidden');
  }

  // 실시간 랭킹 모달 열기
  function openRankingBoard() {
    rankBoardModal.classList.remove('hidden');
    const rankingList = document.getElementById('rankingList');
    rankingList.innerHTML = '<div style="padding: 20px; color: var(--text-muted);">실시간 랭킹 동기화 중...</div>';

    if (window.subscribeRanking) {
      if (unsubscribeRank) unsubscribeRank();
      unsubscribeRank = window.subscribeRanking((ranks) => {
        rankingList.innerHTML = '';
        if (ranks.length === 0) {
          rankingList.innerHTML = '<div style="padding: 20px;">아직 등록된 기록이 없습니다. 1등에 도전하세요!</div>';
          return;
        }

        ranks.forEach((r, idx) => {
          const item = document.createElement('div');
          item.className = 'ranking-item';
          item.innerHTML = `
            <div>
              <strong>#${idx + 1}</strong> ${r.name || '익명'}
            </div>
            <div>
              <span style="color:var(--primary); font-weight:800;">${r.score}점</span>
              <span style="font-size:0.75rem; color:#64748b; margin-left:6px;">(${r.accuracy}%)</span>
            </div>
          `;
          rankingList.appendChild(item);
        });
      });
    }
  }

  // 이벤트 리스너 바인딩
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  document.getElementById('btnRational').addEventListener('click', () => makeChoice('rational'));
  document.getElementById('btnIrrational').addEventListener('click', () => makeChoice('irrational'));

  // 키보드 조작 (←, →)
  window.addEventListener('keydown', (e) => {
    if (!isPlaying) return;
    if (e.key === 'ArrowLeft') makeChoice('rational');
    if (e.key === 'ArrowRight') makeChoice('irrational');
  });

  // 모바일 터치 스와이프 조작
  let touchStartX = 0;
  activeCard.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  activeCard.addEventListener('touchend', (e) => {
    if (!isPlaying) return;
    const touchEndX = e.changedTouches[0].screenX;
    const diff = touchEndX - touchStartX;
    if (diff < -50) makeChoice('rational');
    else if (diff > 50) makeChoice('irrational');
  }, { passive: true });

  // 랭킹 보기 버튼들
  document.getElementById('openRankBtn').addEventListener('click', openRankingBoard);
  document.getElementById('viewRankAfterEndBtn').addEventListener('click', openRankingBoard);
  document.getElementById('closeRankBtn').addEventListener('click', () => {
    rankBoardModal.classList.add('hidden');
    if (unsubscribeRank) {
      unsubscribeRank();
      unsubscribeRank = null;
    }
  });

  // 점수 등록 버튼
  document.getElementById('submitScoreBtn').addEventListener('click', async () => {
    const name = playerNameInput.value.trim();
    if (!name) {
      alert('이름이나 학번을 입력하세요!');
      return;
    }

    const accuracy = totalAttempts > 0 ? Math.round((correctCount / totalAttempts) * 100) : 0;
    rankFeedback.textContent = '등록 중...';

    try {
      if (window.uploadScore) {
        await window.uploadScore(name, score, accuracy);
        rankFeedback.style.color = 'var(--success)';
        rankFeedback.textContent = '성공적으로 등록되었습니다!';
        document.getElementById('rankInputArea').style.display = 'none';
      } else {
        throw new Error('Firebase가 로드되지 않았습니다.');
      }
    } catch (err) {
      console.error(err);
      rankFeedback.style.color = 'var(--irrational-color)';
      rankFeedback.textContent = '등록 실패: Firebase 설정을 확인해주세요.';
    }
  });

  // 초기 렌더링 보정
  window.addEventListener('DOMContentLoaded', () => {
    deck = shuffle(CARD_DATASET);
    nextCard();
  });
</script>
</body>
</html>
